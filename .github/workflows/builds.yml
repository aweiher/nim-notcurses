name: Builds

on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    env:
      COLORTERM: 24bit
      LANG: en_US.UTF-8
      TERM: xterm-256color
    strategy:
      fail-fast: false
      matrix:
        # Linux only in this fork; macOS and Windows are dropped, not fixed.
        #
        # One runner, and it pins both toolchain and library:
        #
        #   ubuntu-26.04  Nim 2.2.4  libnotcurses 3.0.17
        #
        # ubuntu-24.04 was dropped rather than kept red. Its Nim is 1.6.14 and
        # stew, a dependency of this package, needs >= 1.6.18 — so the archive
        # cannot satisfy the build there at all. It also carries libnotcurses
        # 3.0.7, whose NCCHESSWHITE still holds the pre-3.0.17 value; the
        # constant in abi/constants/ncseqs.nim now matches 3.0.17.
        os: [ ubuntu-26.04 ]
    name: 🐧 ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}

    steps:
      # Everything comes from the archive. Building Notcurses from source and
      # installing Nim via choosenim cost the bulk of this workflow's wall
      # clock and all of its cache complexity.
      #
      # Both Notcurses -dev packages are needed, and it is not obvious why:
      # libnotcurses-dev carries the .so, the .a, the .pc and the CMake files
      # but not a single header. notcurses.h, nckeys.h, direct.h and version.h
      # are in libnotcurses-core-dev. `nimble` ships inside `nim`.
      - name: Install Nim and Notcurses via APT
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -yq \
            nim \
            libnotcurses-dev \
            libnotcurses-core-dev
          echo
          nim --version | head -1
          nimble --version | head -1
          echo "libnotcurses $(pkg-config --modversion notcurses)"

      - name: Checkout nim-notcurses sources
        uses: actions/checkout@v4

      - name: Install project dependencies per Nimble
        run: nimble --accept install --depsOnly

      - name: Build examples
        run: |
          extras/build_examples.sh
          extras/build_examples.sh -d:release

      - name: Build and run tests
        run: nimble --verbose test
